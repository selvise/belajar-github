<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>If We Met Again</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="phone">

    <div class="opening" id="opening">

        <div class="opening-content">

            <p class="small-title">IF WE MET AGAIN</p>

            <h1>184</h1>

            <p class="days">
                days since you last talked to them.
            </p>

            <p class="description">
                Tonight, you opened the old chat again.
            </p>

            <button class="open-btn" id="openChat">
                open conversation
            </button>

        </div>

    </div>


    <div class="chat-screen" id="chatScreen">

        <div class="header">
            <h2>if we met again</h2>
            <span>11:47 PM</span>
        </div>

        <div class="chat" id="chat">

    <div class="message me">
        hey.
    </div>

    <div class="message them">
        hey.
    </div>

    <div class="message me">
        are you awake?
    </div>

    <div class="message them">
        yeah.
    </div>

    <div class="message them">
        what's up?
    </div>
    <div class="choices"></div>
</div>
    <script src="script.js"></script>

</body>
</html>
