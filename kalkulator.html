<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator JavaScript</title>

    <style>

        body{
            background-color: rgb(248, 227, 230);
            font-family: Arial;
        }

        .kotak{
            width:300px;
            margin:auto;
            margin-top:100px;
            background:white;
            padding:20px;
            border-radius:5px;
        }

        input,select{
            width:100%;
            padding:8px;
            margin-top:8px;
            margin-bottom:10px;
        }

        button{
            padding:8px 15px;
        }

        h2{
            text-align:center;
        }

    </style>

</head>

<body>

<div class="kotak">

<h2>Kalkulator</h2>

<input type="number" id="bil1" placeholder="Bilangan Pertama">

<select id="operator">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
</select>

<input type="number" id="bil2" placeholder="Bilangan Kedua">

<button onclick="hitung()">Hitung</button>

<button onclick="bersih()">Clear</button>

<h3 id="hasil">Hasil :</h3>

</div>

<script>

function hitung(){

    var bil1 = parseFloat(document.getElementById("bil1").value);
    var bil2 = parseFloat(document.getElementById("bil2").value);
    var operator = document.getElementById("operator").value;

    var hasil;

    if(operator=="+"){
        hasil = bil1 + bil2;
    }
    else if(operator=="-"){
        hasil = bil1 - bil2;
    }
    else if(operator=="*"){
        hasil = bil1 * bil2;
    }
    else if(operator=="/"){
        hasil = bil1 / bil2;
    }

    document.getElementById("hasil").innerHTML = "Hasil : " + hasil;

}

function bersih(){

    document.getElementById("bil1").value="";
    document.getElementById("bil2").value="";
    document.getElementById("operator").value="+";
    document.getElementById("hasil").innerHTML="Hasil :";

}

</script>

</body>
</html>
